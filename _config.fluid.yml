# ============================================================
# Fluid 主题配置覆盖
# ============================================================
# 本文件会以「深合并」方式叠加到主题默认配置之上
# （node_modules/hexo-theme-fluid/_config.yml）
#
# 所以：只写你要修改的项即可，没写的项自动沿用主题默认值
#
# ⚠️ 不要直接改 node_modules/hexo-theme-fluid/_config.yml
#    那个目录被 .gitignore 排除，改动不会进仓库；
#    且 Cloudflare 每次构建都会执行 npm ci 重装依赖，改动会被覆盖
#
# ⚠️ 层级必须和主题默认配置完全一致，否则会变成一个无效的新键
#    用这条命令查某项在第几层：
#    grep -n "关键词" node_modules/hexo-theme-fluid/_config.yml
# ============================================================


# ------------------------------------------------------------
# 首页设置
# ------------------------------------------------------------
index:
  # 首页副标题（"An elegant Material-Design theme for Hexo" 就在这）
  slogan:
    # 关闭副标题 —— 首页不再显示这一行
    enable: true

    # 【想改成自己的文字？】按下面两步：
    #   1. 把上面的 enable 改为 true（或删掉 enable 这行）
    #   2. 取消下面 text 的注释并换成你要的内容
    #
    # 支持列表格式，会随机选一行显示：
    text:
        - JunMochang Blog
        - 长风破浪会有时，直挂云帆济沧海。
    
