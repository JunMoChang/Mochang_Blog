# ============================================================
# Fluid 主题配置覆盖
# ============================================================
# 本文件会以「深合并」方式叠加到主题默认配置之上
# （node_modules/hexo-theme-fluid/_config.yml）
#
# 所以：只写你要修改的项即可，没写的项自动沿用主题默认值
#
# ⚠️ 不要直接改 node_modules/hexo-theme-fluid/_config.yml
#    那个目录被 .gitignore 排除，改动不会进仓库；
#    且 Cloudflare 每次构建都会执行 npm ci 重装依赖，改动会被覆盖
#
# ⚠️ 层级必须和主题默认配置完全一致，否则会变成一个无效的新键
#    用这条命令查某项在第几层：
#    grep -n "关键词" node_modules/hexo-theme-fluid/_config.yml
# ============================================================


# ------------------------------------------------------------
# 首页设置
# ------------------------------------------------------------
index:
  # 首屏大背景图（对应 source/img/banner.jpg）
  banner_img: /img/banner.jpg
  banner_mask_alpha: 0.5    # 黑色蒙版不透明度，越大标题越清晰（默认 0.3）

  # 首页副标题（"An elegant Material-Design theme for Hexo" 就在这）
  slogan:
    # 关闭副标题 —— 首页不再显示这一行
    enable: true

    # 【想改成自己的文字？】按下面两步：
    #   1. 把上面的 enable 改为 true（或删掉 enable 这行）
    #   2. 取消下面 text 的注释并换成你要的内容
    #
    # 支持列表格式，会随机选一行显示：
    text:
        - JunMochang Blog
        - 长风破浪会有时，直挂云帆济沧海。


# ------------------------------------------------------------
# 页脚 —— 站点总 PV / UV
# ------------------------------------------------------------
footer:
  statistics:
    enable: true      # 在页脚显示站点总访问量
    source: "busuanzi"  # 不蒜子，无需注册，零配置


# ------------------------------------------------------------
# 文章页
# ------------------------------------------------------------
post:
  # 文章页大背景图
  banner_img: /img/banner.jpg
  banner_mask_alpha: 0.5    # 黑色蒙版不透明度，越大标题越清晰（默认 0.3）

  meta:
    # 单篇文章的浏览量
    views:
      enable: true      # 在文章标题下方显示该文阅读量
      source: "busuanzi"

  # 评论系统
  comments:
    enable: true
    type: waline        # 使用 Waline（其余 11 种见主题默认配置第 774 行）


# ------------------------------------------------------------
# Waline 评论系统
# ------------------------------------------------------------
# 服务端已部署在 Cloudflare Workers + D1（独立于博客仓库）
# 管理后台：https://waline.junmochang12.workers.dev/ui
waline:
  serverURL: 'https://waline.junmochang12.workers.dev'


# ------------------------------------------------------------
# 大背景（首屏头图）—— 各页面统一使用同一张
# ------------------------------------------------------------
# 图片位置：source/img/banner.jpg
# 已从 4K 压缩：3840x2160 / 209 KB  →  1920x1080 / 103 KB
# 想换图：替换 source/img/banner.jpg 即可，四个页面会一起更新
archive:
  banner_img: /img/banner.jpg
  banner_mask_alpha: 0.5    # 黑色蒙版不透明度，越大标题越清晰（默认 0.3）

category:
  banner_img: /img/banner.jpg
  banner_mask_alpha: 0.5    # 黑色蒙版不透明度，越大标题越清晰（默认 0.3）

tag:
  banner_img: /img/banner.jpg
  banner_mask_alpha: 0.5    # 黑色蒙版不透明度，越大标题越清晰（默认 0.3）

# 「关于」页面 —— 使用 Fluid 原生布局（source/about/index.md 里设了 layout: about）
# 头像 / 名字 / 简介 / 社交图标都在这里配置；正文仍写在 index.md 里
about:
  banner_img: /img/banner.jpg
  banner_mask_alpha: 0.5    # 黑色蒙版不透明度，越大标题越清晰（默认 0.3）
  avatar: /img/avatar.jpg          # 对应 source/img/avatar.jpg
  name: "JunMochang"               # 想改名字改这里
  intro: "这个人不懒，但是什么都没写"    # 一句话简介
  # 社交图标，鼠标悬停会显示 tip 文字
  # 实测：此处数组会「整体替换」主题默认值，主题自带的豆瓣/微信不会出现
  # 想加图标就往下续行，常用 class 可从 https://hexo.fluid-dev.com/docs/icon/ 查
  icons:
    - { class: "iconfont icon-github-fill", link: "https://github.com/JunMoChang", tip: "GitHub" }
    # - { class: "iconfont icon-mail-fill", link: "mailto:你的邮箱", tip: "邮箱" }

# 其他自定义页面（source/ 下非 _posts 的页面）走这个
page:
  banner_img: /img/banner.jpg
  banner_mask_alpha: 0.5    # 黑色蒙版不透明度，越大标题越清晰（默认 0.3）

# 404 页面
page404:
  banner_img: /img/banner.jpg
  banner_mask_alpha: 0.5    # 黑色蒙版不透明度，越大标题越清晰（默认 0.3）
    
